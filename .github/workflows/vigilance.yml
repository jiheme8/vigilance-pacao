name: Mise a jour vigilance
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperer la vigilance
        run: python scripts/build_vigilance.py
      - name: Publier vigilance.json si change
        run: |
          if [ -n "$(git status --porcelain vigilance.json)" ]; then
            git config user.name  "vigilance-bot"
            git config user.email "actions@github.com"
            git add vigilance.json
            git commit -m "Vigilance $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
