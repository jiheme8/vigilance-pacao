name: Mise a jour vigilance
on:
  push:
    paths-ignore:
      - 'vigilance.json'
      - 'alert_state.json'
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: vigilance
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperer la vigilance et notifier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_vigilance.py
      - name: Publier les fichiers si change
        run: |
          git config user.name  "vigilance-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."; exit 0
          fi
          git commit -m "Vigilance $(date -u +'%Y-%m-%d %H:%M UTC')"
          n=0
          until git push; do
            n=$((n+1))
            if [ $n -ge 5 ]; then echo "Echec du push apres $n tentatives."; exit 1; fi
            echo "Push rejete, resynchronisation ($n)..."
            git fetch origin main
            git reset --soft FETCH_HEAD
            git add -A
            git commit -m "Vigilance $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          done
          echo "Pousse."
